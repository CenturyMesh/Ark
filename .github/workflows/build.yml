name: Build and test
on: [push, pull_request]
permissions:
  contents: read

jobs:
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B out/core -DARK_WITH_OCCT=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build out/core --config Release --parallel 2
      - run: ctest --test-dir out/core -C Release --output-on-failure

  windows-native-occt:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build OCCT 8 native SDK
        shell: pwsh
        run: ./scripts/build-occt.ps1 -Jobs 2
      - name: Build and test ARK with native OCCT
        shell: pwsh
        run: ./scripts/build.ps1 -Test -Jobs 2
      # Live Studio UI checks are opt-in; hosted OpenGL 3.3 availability is not assumed.

  linux-native-occt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl ca-certificates unzip patchelf
      - name: Build and test Linux CLI, MCP and OCCT worker
        run: bash scripts/build.sh --test --jobs 2
      - name: Prepare Linux headless package
        run: bash scripts/package-linux.sh
      - name: Test relocated package without the build SDK
        run: |
          mkdir -p out/linux-smoke
          tar -xzf out/releases/ark-linux-x64-headless-*.tar.gz -C out/linux-smoke
          docker run --rm \
            --mount "type=bind,source=$PWD/out/linux-smoke,target=/packages,readonly" \
            --mount "type=bind,source=$PWD/tests/linux_package_smoke.sh,target=/smoke.sh,readonly" \
            ubuntu:24.04 bash -c 'bash /smoke.sh /packages/ark-linux-x64-headless-*'
      - uses: actions/upload-artifact@v4
        with:
          name: ark-linux-x64-headless
          path: out/releases/ark-linux-x64-headless-*.tar.gz*
          if-no-files-found: error
