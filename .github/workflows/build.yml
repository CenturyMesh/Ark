name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test exact OCCT patch mechanism without an SDK build
        shell: pwsh
        run: ./tests/occt_patch_tests.ps1
      - name: Prepare pinned local semantic model on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-memory-embeddings.ps1
      - run: cmake -S . -B out/core -DARK_WITH_OCCT=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build out/core --config Release --parallel 2
      - run: ctest --test-dir out/core -C Release --output-on-failure --output-junit "${{ github.workspace }}/out/core/regression-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regressions-${{ matrix.os }}
          path: out/core/regression-results.xml
          if-no-files-found: warn

  windows-native-occt:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Identify hosted Windows image
        id: runner-image
        shell: pwsh
        run: |
          if (-not $env:ImageVersion) { throw 'Hosted runner ImageVersion is required for the OCCT cache key.' }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore OCCT native SDK and notices
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/deps/occt/install-msvc-ark-offset-001
          key: windows-2022-occt-msvc-x64-ark-offset-001-v1-${{ steps.runner-image.outputs.version }}-${{ hashFiles('scripts/build-occt.ps1', 'scripts/ApplyOcctPatch.cmake', 'third_party/occt/patches/8.0.1/**') }}
      - name: Build OCCT 8 native SDK
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-occt.ps1 -Jobs 2
      - name: Save OCCT native SDK and notices
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/deps/occt/install-msvc-ark-offset-001
          key: ${{ steps.occt-cache.outputs.cache-primary-key }}
      - name: Build and test ARK with native OCCT
        shell: pwsh
        run: ./scripts/build.ps1 -Test -Jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-regressions
          path: |
            out/native-release/regression-results.xml
            out/native-release/native-authoring-corpus-v1.receipt.json
            out/native-release/drawing-dxf-v1.receipt.json
          if-no-files-found: warn
      # Live Studio UI checks are opt-in; hosted OpenGL 3.3 availability is not assumed.

  windows-installer:
    # ARK Setup (installer/ArkSetup) with a synthetic payload: no native build, no real registration or shortcuts.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build ARK Setup in the public and self-test configurations
        shell: pwsh
        run: |
          dotnet publish installer/ArkSetup/ArkSetup.csproj -c Release -p:ArkSetupSelfTest=false -o out/installer-ci/public --nologo
          if ($LASTEXITCODE -ne 0) { throw 'The public configuration did not build.' }
          dotnet publish installer/ArkSetup/ArkSetup.csproj -c Release -p:ArkSetupSelfTest=true -p:ArkTestIsolationId=hosted-ci -o out/installer-ci/self-test --nologo
          if ($LASTEXITCODE -ne 0) { throw 'The self-test configuration did not build.' }
      - name: Render the setup pages (self-test build, layout only)
        shell: pwsh
        run: |
          $captures = Join-Path $PWD 'out/installer-ci/pages'
          $page = Start-Process -FilePath out/installer-ci/self-test/ARK-Setup.exe -ArgumentList @('--screenshot', ('"' + $captures + '"'), '--layout-only') -PassThru
          $null = $page.Handle
          if (-not $page.WaitForExit(120000)) { $page.Kill(); throw 'The page renderer timed out.' }
          $layout = Get-Content -LiteralPath (Join-Path $captures 'layout.txt') -Raw
          Write-Output $layout
          if ($page.ExitCode -ne 0) { throw "The page renderer returned $($page.ExitCode)." }
          foreach ($name in @('welcome','options','installing','done','error','uninstall')) {
            if ($layout -notmatch "(?m)^${name}: elements=[1-9][0-9]*; outside=0; overlap=0; clipped=0;") { throw "Page $name failed its layout checks." }
          }
      - name: Test installer process detection, payload reading and the disk plan
        shell: pwsh
        run: |
          dotnet run --project tests/installer_process_070a -c Release --artifacts-path out/installer-ci/process
          if ($LASTEXITCODE -ne 0) { throw 'The installer process, payload or disk plan checks failed.' }
      - name: Test the installer engine with a synthetic payload, including a temporary test signature
        shell: powershell
        run: ./tests/installer_engine_tests.ps1 -OutputDirectory out/installer-ci/engine -Signing
      - name: Collect the setup log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path ([IO.Path]::GetTempPath()) 'ARK-Setup.log'
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination out/installer-ci/ARK-Setup.log }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-installer-logs
          path: |
            out/installer-ci/ARK-Setup.log
            out/installer-ci/pages/layout.txt
          if-no-files-found: ignore

  linux-native-occt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build curl ca-certificates unzip patchelf
      - name: Build and test Linux CLI, MCP and OCCT worker
        run: bash scripts/build.sh --test --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-regressions
          path: |
            out/linux-native-release/regression-results.xml
            out/linux-native-release/native-authoring-corpus-v1.receipt.json
            out/linux-native-release/drawing-dxf-v1.receipt.json
          if-no-files-found: warn
      - name: Prepare Linux headless package
        run: bash scripts/package-linux.sh
      - name: Test relocated package without the build SDK
        run: |
          mkdir -p out/linux-smoke
          tar -xzf out/releases/ark-linux-x64-headless-*.tar.gz -C out/linux-smoke
          docker run --rm \
            --mount "type=bind,source=$PWD/out/linux-smoke,target=/packages,readonly" \
            --mount "type=bind,source=$PWD/tests/linux_package_smoke.sh,target=/smoke.sh,readonly" \
            ubuntu:24.04 bash -c 'bash /smoke.sh /packages/ark-linux-x64-headless-*'
      - uses: actions/upload-artifact@v4
        with:
          name: ark-linux-x64-headless
          path: out/releases/ark-linux-x64-headless-*.tar.gz*
          if-no-files-found: error
